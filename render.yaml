# Render Blueprint: backend API + Postgres database.
# Render reads this file from the repository root (New > Blueprint).
services:
  - type: web
    name: todo-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString
      # Signs login tokens; generated once by Render
      - key: SECRET_KEY
        generateValue: true
      - key: OPEN_ROUTER_URL
        value: https://openrouter.ai/api/v1
      # Entered in the Render dashboard, never committed
      - key: OPEN_ROUTER_API_KEY
        sync: false

databases:
  - name: todo-db
    plan: free
